 ['Shall we start the meeting?','هل نبدأ الاجتماع؟'],['Thank you for joining us.','شكرًا لانضمامكم إلينا.'],['Let us review the agenda.','دعونا نراجع جدول الأعمال.'],['Can you hear me clearly?','هل يمكنك سماعي بوضوح؟'],['I have a question.','لدي سؤال.'],['I would like to add something.','أود أن أضيف شيئًا.'],['Could you explain that again?','هل يمكنك شرح ذلك مرة أخرى؟'],['I agree with this suggestion.','أنا أتفق مع هذا الاقتراح.'],['I have a different opinion.','لدي رأي مختلف.'],['What is the next step?','ما الخطوة التالية؟'],['We need to make a decision.','نحتاج إلى اتخاذ قرار.'],['Let us stay on topic.','دعونا نلتزم بالموضوع.'],['Who will handle this task?','من سيتولى هذه المهمة؟'],['Can we set a deadline?','هل يمكننا تحديد موعد نهائي؟'],['Let us schedule a follow-up meeting.','دعونا نحدد اجتماع متابعة.'],['I will share the meeting notes.','سأشارك ملاحظات الاجتماع.'],['Are there any questions?','هل توجد أي أسئلة؟'],['Thank you, everyone.','شكرًا لكم جميعًا.'] ],
 dialogue:[['A','Shall we start the meeting?','هل نبدأ الاجتماع؟'],['B','Yes, everyone is here.','نعم، الجميع موجود.'],['A','Let us review the agenda.','دعونا نراجع جدول الأعمال.'],['B','I have a question about the timeline.','لدي سؤال حول الجدول الزمني.'],['A','Sure. What would you like to know?','بالتأكيد. ماذا تود أن تعرف؟']]},
 {id:'calls',name:'المكالمات والإيميلات',subtitle:'اتصل واتواصل باحتراف',icon:'📞',color:'#e8f4fb',accent:'#338db0',level:'متوسط',phrases:[
 ['Hello, this is Ahmed speaking.','مرحبًا، معك أحمد.'],['May I speak to the manager?','هل يمكنني التحدث إلى المدير؟'],['Who is calling, please?','من المتصل من فضلك؟'],['Could you hold for a moment?','هل يمكنك الانتظار لحظة؟'],['I will transfer your call.','سأحوّل مكالمتك.'],['The line is breaking up.','الصوت يتقطع.'],['Could you speak more slowly?','هل يمكنك التحدث ببطء أكثر؟'],['I will call you back.','سأتصل بك مرة أخرى.'],['Please leave a message.','من فضلك اترك رسالة.'],['I am calling regarding your request.','أتصل بخصوص طلبك.'],['I sent you an email.','أرسلت لك بريدًا إلكترونيًا.'],['Please find the attached document.','يرجى الاطلاع على المستند المرفق.'],['I am following up on my previous email.','أتابع رسالتي الإلكترونية السابقة.'],['Looking forward to your reply.','أتطلع إلى ردك.'],['Thank you for your quick response.','شكرًا لردك السريع.'],['Could you confirm the appointment?','هل يمكنك تأكيد الموعد؟'],['I apologize for the delay.','أعتذر عن التأخير.'],['Please let me know if you need anything.','أخبرني إذا احتجت إلى أي شيء.'] ],
 dialogue:[['A','Hello, this is Ahmed speaking.','مرحبًا، معك أحمد.'],['B','Hello. I am calling about the document.','مرحبًا. أتصل بشأن المستند.'],['A','I sent it by email this morning.','أرسلته بالبريد الإلكتروني صباح اليوم.'],['B','Thank you. I will check it now.','شكرًا. سأراجعه الآن.']]},
 {id:'shopping',name:'التسوق والمطاعم',subtitle:'اطلب واسأل عن الأسعار',icon:'🛍️',color:'#ffeef1',accent:'#cb6383',level:'مبتدئ',phrases:[
 ['How much does this cost?','كم سعر هذا؟'],['Do you have this in another size?','هل لديك مقاس آخر من هذا؟'],['Can I try it on?','هل يمكنني تجربته؟'],['Is there a discount?','هل يوجد خصم؟'],['I am just looking, thank you.','أنا أتفرج فقط، شكرًا.'],['Can I pay by card?','هل يمكنني الدفع بالبطاقة؟'],['Can I have a receipt?','هل يمكنني الحصول على فاتورة؟'],['I would like a table for two.','أريد طاولة لشخصين.'],['Can I see the menu, please?','هل يمكنني رؤية قائمة الطعام؟'],['What do you recommend?','بماذا تنصحني؟'],['I would like some water.','أريد بعض الماء.'],['No sugar, please.','بدون سكر من فضلك.'],['Could I have the bill, please?','هل يمكنني الحصول على الحساب؟'],['The food is delicious.','الطعام لذيذ.'],['I would like it to go.','أريده سفري.'],['Is delivery available?','هل خدمة التوصيل متاحة؟'] ],

 dialogue:[['A','Good evening. I have a reservation.','مساء الخير. لدي حجز.'],['B','May I have your passport, please?','هل يمكنني أخذ جواز سفرك من فضلك؟'],['A','Of course. Here you are.','بالطبع. تفضل.'],['B','Your room is on the third floor.','غرفتك في الطابق الثالث.'],['A','Thank you very much.','شكرًا جزيلًا.']]},

  speaker:String(turn.speaker|| (i%2?'B':'A')).slice(0,30),
  en:String(turn.en||'').slice(0,850),
  ar:String(turn.ar||'').slice(0,850)
 })).filter(x=>x.en);
 if(!turns.length)return;
 const phrases=turns.map((p,i)=>({id:raw.id+'-'+i,lesson:raw.id,en:p.en,ar:p.ar}));
 const lesson={id:raw.id,name:String(raw.name||'محادثة مستوردة'),subtitle:'نص من ملفاتك · '+turns.length+' جملة',
 icon:'📄',color:'#efeaff',accent:'#7350a0',level:'ملف شخصي',phrases,dialogue:turns.map(p=>[p.speaker,p.en,p.ar])};
 LESSONS.push(lesson);ALL_PHRASES.push(...phrases);
}
for(const record of savedScripts()){importedScripts.push(record);addScriptToLessons(record);}
function stripOldScript(id){
 const index=LESSONS.findIndex(l=>l.id===id);
 if(index!==-1)LESSONS.splice(index,1);
 for(let i=ALL_PHRASES.length-1;i>=0;i--)if(ALL_PHRASES[i].lesson===id)ALL_PHRASES.splice(i,1);
 state.favorites=state.favorites.filter(p=>!p.startsWith(id+'-'));
 state.learned=state.learned.filter(p=>!p.startsWith(id+'-'));
 update();
}
function removeImportedScript(id){
 const index=importedScripts.findIndex(r=>r.id===id);
 if(index<0)return;
 if(!window.confirm('هل تريد حذف نص هذا الملف من التطبيق؟'))return;
 const deleted=importedScripts.splice(index,1)[0];
 if(!persistScripts()){importedScripts.splice(index,0,deleted);toast('تعذر حفظ التغيير');return}
 stripOldScript(id);openPage('scripts');toast('تم حذف النص المستورد')
}
async function importTranscriptFiles(files){
 let count=0,errors=[];
 for(const file of Array.from(files||[])){
  try{
   if(!/\.(srt|vtt|txt)$/i.test(file.name))throw Error('صيغة الملف غير مدعومة');
   if(file.size>5*1024*1024)throw Error('الملف أكبر من 5 ميجابايت');
   const source=typeof file.text==='function'?await file.text():await new Promise((resolve,reject)=>{
     const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('تعذر القراءة'));reader.readAsText(file);
   });
   const parsed=window.EtkallemImporter.parse(source,file.name);
   const id='user_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
   const record={id,name:parsed.name,kind:parsed.kind,turns:parsed.turns,createdAt:new Date().toISOString()};
   importedScripts.push(record);
   if(!persistScripts()){importedScripts.pop();throw Error('امتلأت مساحة التخزين؛ جرّب ملفًا أصغر')}
   addScriptToLessons(record);
   count++;
  }catch(error){errors.push(file.name+': '+(error.message||'تعذر استيراد الملف'))}
 }
 openPage('scripts');
 if(count)toast('تم استيراد '+count+' ملف بنجاح');
 if(errors.length)window.alert(errors.join('\n'));
}

function installedVoiceList(){
 try {
  if(window.AndroidTTS && typeof AndroidTTS.getVoices==='function'){
   const v=JSON.parse(AndroidTTS.getVoices());return Array.isArray(v)?v.map(x=>({id:x.id,locale:x.locale||'en',network:!!x.network,quality:x.quality,native:true})):[];
  }
  if('speechSynthesis' in window)
   return speechSynthesis.getVoices().filter(x=>x.lang?.toLowerCase().startsWith('en')).map(x=>({id:x.name,locale:x.lang,network:!x.localService,native:false}));
 }catch(e){}
 return [];
}

 toast('تم اختيار الصوت. اضغط تجربة لسماعه.');
}

function settingsPage(){return title('إعدادات التعلّم','ظبّط تجربتك على حسب وقتك وطريقتك في المذاكرة.')+`<div class="container"><div class="setting-row"><div><b>🎯 الهدف اليومي</b><small>عدد الجمل المقترح حفظها كل يوم</small></div><select data-setting="target"><option value="5" ${state.target===5?'selected':''}>5 جمل</option><option value="10" ${state.target===10?'selected':''}>10 جمل</option><option value="15" ${state.target===15?'selected':''}>15 جملة</option></select></div><div class="setting-row"><div><b>🔊 سرعة النطق</b><small>سرعة قراءة الجمل الإنجليزية</small></div><select data-setting="rate"><option value="0.65" ${state.rate===.65?'selected':''}>بطيئة</option><option value="0.85" ${state.rate===.85?'selected':''}>متوسطة</option><option value="1" ${state.rate===1?'selected':''}>طبيعية</option></select></div><div class="setting-row"><div><b>🔁 تكرار النطق</b><small>مرة أو مرتين عند سماع الجملة</small></div><select data-setting="repeat"><option value="1" ${state.repeat===1?'selected':''}>مرة</option><option value="2" ${state.repeat===2?'selected':''}>مرتين</option></select></div><div class="setting-row"><div><b>🇪🇬 الترجمة العربية</b><small>إظهار أو إخفاء الترجمة أسفل الجمل</small></div><select data-setting="showArabic"><option value="true" ${state.showArabic?'selected':''}>إظهار</option><option value="false" ${!state.showArabic?'selected':''}>إخفاء</option></select></div><div class="setting-row"><div><b>🎧 اختر صوت المدرّس</b><small>اختر صوتًا إنجليزيًا من الأصوات المثبّتة على جهازك. الأصوات الطبيعية تختلف حسب الهاتف.</small></div><select id="voicePicker" style="max-width:58%;font-size:12px">${voiceOptionsHtml()}</select></div><div class="setting-row"><div><b>🔊 تجربة الصوت المختار</b><small>اسمع الجملة ثم بدّل الصوت وقارن بنفسك</small></div><button data-action="testVoice">تشغيل ▶</button></div><div class="info-note">التطبيق بيحفظ الجمل المفضلة والتقدم على نفس الجهاز. ملفات الدروس متاحة بدون إنترنت، والنطق بيستخدم أصوات الإنجليزي المثبتة على هاتفك. التدريب بالميكروفون قد يحتاج لخدمة التعرّف على الكلام والإنترنت.</div><p style="text-align:center;color:#9cacb9;font-size:11px">اتكلم · 3000 English Phrases & Dialogues · v2.2</p></div>`}
function render(){topNav();const pages={home,lessons:lessonsPage,lesson:lessonPage,favorites:favoritesPage,practice:practicePage,quiz:quizPage,speaking:speakingPage,settings:settingsPage,scripts:scriptsPage};$('#view').innerHTML=(pages[state.page]||home)()}
function findPhrase(id){return ALL_PHRASES.find(p=>p.id===id)}
let speakingQueueToken=0,pendingDone=null;
function nativeSpeak(text,rate){return new Promise(resolve=>{let resolved=false;const finish=()=>{if(!resolved){resolved=true;pendingDone=null;resolve()}};if(window.AndroidTTS&&typeof window.AndroidTTS.speak==='function'){const token=String(Date.now())+'-'+Math.random().toString(36).slice(2);pendingDone={token,finish};window.AndroidTTS.speak(text,rate,token);setTimeout(finish,12000);return}if(!('speechSynthesis' in window)){toast('جهازك لا يدعم القراءة الصوتية');finish();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.onend=finish;u.onerror=finish;const voices=speechSynthesis.getVoices();const chosenName=currentVoiceName();const en=voices.find(v=>v.name===chosenName)||voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang?.startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u);setTimeout(finish,12000)})}
window.onNativeTtsDone=token=>{if(pendingDone&&pendingDone.token===token)pendingDone.finish()};
function stopAll(){speakingQueueToken++;state.playing=false;if(window.AndroidTTS?.stop)window.AndroidTTS.stop();if('speechSynthesis' in window)speechSynthesis.cancel();if(pendingDone)pendingDone.finish()}
async function playSequence(texts,rate=state.rate){stopAll();const token=speakingQueueToken;state.playing=true;for(let s of texts){for(let r=0;r<state.repeat;r++){if(token!==speakingQueueToken)break;await nativeSpeak(s,rate);if(token!==speakingQueueToken)break;await new Promise(ok=>setTimeout(ok,190))}}if(token===speakingQueueToken)state.playing=false}
function playOne(en,rate=state.rate){playSequence([en],rate)}
function answerQuiz(id){const q=state.quiz;if(!q||q.answer)return;q.answer=id;if(id===q.questions[q.idx].p.id)q.score++;render()}
function nextQuiz(){let q=state.quiz;if(!q)return;q.idx++;q.answer=null;if(q.idx===q.questions.length){state.quizzes++;update()}render()}
function choiceSpeaking(){const list=ALL_PHRASES.filter(p=>p.en.length<=65);state.voiceTarget=Math.floor(Math.random()*list.length);render()}
function normalizeWords(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean)}
function compareSpeech(said){const expected=normalizeWords(getSpeakingPhrase().en),actual=normalizeWords(said);let matched=0;let remaining=[...actual];expected.forEach(w=>{let idx=remaining.indexOf(w);if(idx>=0){matched++;remaining.splice(idx,1)}});const accuracy=Math.round((matched/Math.max(expected.length,actual.length,1))*100);return accuracy}
window.onNativeRecognition=(said)=>{const el=$('#recognitionStatus'),r=$('#recognitionResult');if(!el||!r)return;r.style.display='block';r.textContent=said||'لم أسمع كلامًا واضحًا';if(said){let score=compareSpeech(said);el.textContent=score>=85?'🌟 ممتاز! نطقك قريب جدًا من الجملة':score>=55?'👍 كويس! اسمع الجملة وكرّر مرة أخرى':'💪 حاول مرة تانية؛ اسمع النطق ببطء';r.insertAdjacentHTML('beforeend',`<div style="direction:rtl;text-align:right;font-weight:800;margin-top:8px;color:#148b80">تطابق الكلمات: ${score}% (تقييم تقريبي)</div>`)}else el.textContent='لم يتم التعرف على الكلام. جرّب مرة أخرى.'};
window.onNativeRecognitionError=(s)=>{const el=$('#recognitionStatus');if(el)el.textContent='التعرّف على الصوت غير متاح: '+s};
function listen(){const el=$('#recognitionStatus');if(el)el.textContent='🎙 اسمعك دلوقتي... انطق الجملة بالإنجليزي';if(window.AndroidTTS?.listen){window.AndroidTTS.listen();return}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){if(el)el.textContent='المتصفح لا يدعم التعرف على الصوت. استخدم التطبيق على أندرويد أو Chrome.';return}const r=new SpeechRecognition();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=evt=>window.onNativeRecognition(evt.results[0][0].transcript);r.onerror=evt=>window.onNativeRecognitionError(evt.error);r.onend=()=>{if(el&&el.textContent.includes('اسمعك'))el.textContent='اضغط على الميكروفون للمحاولة مجددًا'};try{r.start()}catch(e){window.onNativeRecognitionError(e.message)}}
function handle(action,id,btn){switch(action){case'nav':openPage(id);break;case'scripts':openPage('scripts');break;case'deleteScript':removeImportedScript(id);break;case'lesson':openPage('lesson',{lesson:id});break;case'lessonMode':state.lessonMode=id;state.search='';stopAll();render();break;case'speak':{const p=findPhrase(id);if(p)playOne(p.en);break}case'speakSlow':{const p=findPhrase(id);if(p)playOne(p.en,.6);break}case'speakRaw':playOne(btn.dataset.text);break;case'favorite':{const idx=state.favorites.indexOf(id);idx>=0?state.favorites.splice(idx,1):state.favorites.push(id);update();render();toast(idx>=0?'تمت الإزالة من المفضلة':'تمت الإضافة للمفضلة ♥');break}case'learn':{const idx=state.learned.indexOf(id);idx>=0?state.learned.splice(idx,1):state.learned.push(id);update();render();toast(idx>=0?'تم إلغاء علامة الحفظ':'برافو عليك! جملة جديدة اتحفظت 🌟');break}case'scrollDaily':$('#dailyLesson')?.scrollIntoView({behavior:'smooth'});break;case'playDaily':playSequence(daysPhrase().map(p=>p.en));toast('بيتم تشغيل جمل اليوم بالترتيب');break;case'playLesson':if(state.playing){stopAll();render()}else{const l=LESSONS.find(x=>x.id===state.lesson);playSequence(l.phrases.map(x=>x.en));btn.textContent='■ إيقاف';toast('بيتم تشغيل الجمل بالترتيب')}break;case'playDialogue':{const l=LESSONS.find(x=>x.id===state.lesson);playSequence(l.dialogue.map(x=>x[1]));toast('استمع للمحادثة');break}case'lessonQuiz':beginQuiz(state.lesson);break;case'lessonSpeaking':choiceSpeaking();openPage('speaking');break;case'newQuiz':beginQuiz();break;case'answer':answerQuiz(id);break;case'nextQuiz':nextQuiz();break;case'speaking':choiceSpeaking();openPage('speaking');break;case'nextSpeaking':choiceSpeaking();break;case'listen':listen();break;case'testVoice':playOne('Hello! Welcome to Etkallem. Let us practice English together.');break;}}
document.addEventListener('click',evt=>{const btn=evt.target.closest('[data-action]');if(btn){evt.preventDefault();handle(btn.dataset.action,btn.dataset.id,btn)}});
document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.tab)));
$('#backBtn').addEventListener('click',()=>openPage(state.page==='lesson'?'lessons':'home'));
$('#quickSpeak').addEventListener('click',()=>playOne('Hello! It is a great day to learn English.'));
document.addEventListener('input',evt=>{if(evt.target.id==='searchInput'){state.search=evt.target.value;const l=LESSONS.find(x=>x.id===state.lesson);const filtered=l.phrases.filter(p=>(p.en+' '+p.ar).toLowerCase().includes(state.search.toLowerCase()));$('#phraseResults').innerHTML=filtered.map(phraseCard).join('')||'<div class="empty">مفيش نتائج للبحث ده</div>'}});
document.addEventListener('change',evt=>{if(evt.target.id==='scriptImport'){importTranscriptFiles(evt.target.files);return}if(evt.target.id==='voicePicker'){setTeacherVoice(evt.target.value);return}const field=evt.target.dataset.setting;if(!field)return;state[field]=field==='showArabic'?evt.target.value==='true':Number(evt.target.value);update();toast('تم حفظ الإعداد');if(field==='showArabic')render()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();

window.onSystemBack=function(){if(state.page==='home')return false;openPage(state.page==='lesson'?'lessons':'home');return true};

</script>
</body>
