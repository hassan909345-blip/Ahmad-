<script>
'use strict';
const STORE='etkallem-english-v2';
const defaultPrefs={learned:[],favorites:[],target:10,rate:.85,repeat:1,showArabic:true,quizzes:0};
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){}
const state={...defaultPrefs,...saved,page:'home',lesson:'daily',lessonMode:'phrases',search:'',filter:'all',trainingMode:'hub',quiz:null,voiceTarget:null,playing:false};
const $=sel=>document.querySelector(sel);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const update=()=>{const {learned,favorites,target,rate,repeat,showArabic,quizzes}=state;try{localStorage.setItem(STORE,JSON.stringify({learned,favorites,target,rate,repeat,showArabic,quizzes}))}catch(e){}};
function dayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function daysPhrase(){const d=new Date();const day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);let sampled=[];for(let i=0;i<state.target;i++){sampled.push(ALL_PHRASES[((day*13)+(i*31))%ALL_PHRASES.length])}return sampled}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
const icons={play:'▶',listen:'🔊',star:'♡',starOn:'♥',check:'✓',mic:'🎙'};
function topNav(){const back=!['home','lessons','practice','favorites','settings'].includes(state.page);$('#backBtn').hidden=!back;document.querySelectorAll('.bottom-nav button').forEach(b=>{const tab=(state.page==='lesson'||state.page==='dialogue')?'lessons':state.page==='quiz'||state.page==='speaking'?'practice':state.page;b.classList.toggle('active',b.dataset.tab===tab)})}
function openPage(page,opts={}){stopAll();state.page=page;if(opts.lesson)state.lesson=opts.lesson;if(opts.mode)state.lessonMode=opts.mode;if(!opts.keepSearch)state.search='';state.filter='all';render();window.scrollTo(0,0)}
function categoryCards(list=LESSONS){return `<div class="category-grid">${list.map(l=>`<button class="category-card" data-action="lesson" data-id="${l.id}" style="--cat-bg:${l.color};--cat-accent:${l.accent}"><span class="cat-emoji">${l.icon}</span><strong>${l.name}</strong><small>${l.subtitle}</small><div class="cat-foot">${l.phrases.length} جملة &nbsp; ←</div></button>`).join('')}</div>`}
function phraseCard(p,index){const fav=state.favorites.includes(p.id),done=state.learned.includes(p.id);return `<article class="phrase-card"><div class="phrase-top"><span class="phrase-num">${String(index+1).padStart(2,'0')}</span><div class="phrase-body"><div class="phrase-en" lang="en">${esc(p.en)}</div>${state.showArabic?`<div class="phrase-ar">${esc(p.ar)}</div>`:''}</div></div><div class="phrase-actions"><div class="action-left"><button class="mini-action speak" data-action="speak" data-id="${p.id}" aria-label="اسمع النطق">🔊 اسمع</button><button class="mini-action" data-action="speakSlow" data-id="${p.id}" aria-label="اسمع ببطء">🐢 بطيء</button></div><div class="action-right"><button class="mini-action done ${done?'on':''}" data-action="learn" data-id="${p.id}" aria-label="حفظ الجملة">✓ ${done?'حفظتها':'حفظ'}</button><button class="mini-action fav ${fav?'on':''}" data-action="favorite" data-id="${p.id}" aria-label="إضافة للمفضلة">${fav?'♥':'♡'}</button></div></div></article>`}
function title(t,sub=''){return `<div class="page-head"><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div>`}
function home(){const tod=daysPhrase();const completed=tod.filter(p=>state.learned.includes(p.id)).length;const pct=Math.round(completed/tod.length*100);return `<section class="hero"><div class="eyebrow">✦ كل يوم خطوة أقرب للطلاقة</div><h1>اتعلم إنجليزي<br><em>تستخدمه بجدّ!</em></h1><p>محادثات يومية وفي العمل، استمع للنطق الصحيح وكرّر بصوتك كل يوم.</p><div class="hero-foot"><button class="start-btn" data-action="scrollDaily">ابدأ درس اليوم &nbsp; ←</button><span class="streak">🎯 <b>${state.target}</b> جمل يوميًا</span></div></section><div class="container"><div class="section-title"><h2>تقدّمك اليوم</h2><span class="pill">${esc(dayKey())}</span></div><div class="progress-card"><span class="progress-icon">✓</span><div class="progress-text"><b>${completed===state.target?'أحسنت! أنهيت هدفك اليوم 🎉':'ممتاز، كمّل طريقك!'}</b><span>الجمل اللي حفظتها من درس اليوم</span><div class="bar"><span style="width:${pct}%"></span></div></div><span class="progress-count">${completed}/${state.target}</span></div><div class="section-title" style="margin-top:25px"><h2>اتعلّم حسب الموقف</h2><button data-action="nav" data-id="lessons">كل الأقسام ←</button></div>${categoryCards(LESSONS.slice(0,4))}<div class="daily-box" id="dailyLesson"><div class="section-title"><h2>📘 جمل النهارده</h2><button data-action="playDaily">🔊 اسمع الكل</button></div><div>${tod.map(phraseCard).join('')}</div></div><div class="more-bottom"></div></div>`}
function lessonsPage(){return title('كل أقسام المحادثات','اختار الموقف اللي تحب تتدرب عليه. الجمل متاحة بدون اتصال بالإنترنت.')+`<div class="container">${categoryCards()}<div class="info-note">💡 اضغط على أي قسم، واسمع الجملة بالسرعة العادية أو ببطء، وبعدها جرّب تقولها بصوتك من صفحة التدريب.</div></div>`}
function lessonPage(){const l=LESSONS.find(x=>x.id===state.lesson)||LESSONS[0];const view=state.lessonMode==='dialogue';const filtered=l.phrases.filter(p=>((p.en+' '+p.ar).toLowerCase().includes(state.search.toLowerCase())));return `<div class="lesson-cover"><div class="lesson-cover-inner" style="background:${l.color}"><span class="big-emoji">${l.icon}</span><div><h1>${l.name}</h1><p>${l.subtitle}</p><span class="pill">${l.phrases.length} جملة · ${l.level}</span></div></div><div class="lesson-toolbar"><button class="toolbar-btn primary" data-action="playLesson">${state.playing?'■ إيقاف':'▶ اسمع الجمل بالتتابع'}</button><button class="toolbar-btn" data-action="lessonQuiz">اختبر نفسك</button><button class="toolbar-btn" data-action="lessonSpeaking">🎙 جرّب نطقك</button></div></div><div class="switcher"><button data-action="lessonMode" data-id="phrases" class="${!view?'active':''}">📚 الجمل</button><button data-action="lessonMode" data-id="dialogue" class="${view?'active':''}">💬 محادثة كاملة</button></div>${view?`<div class="container dialogue-list"><p style="font-size:13px;color:#738298;margin:2px 0 18px">اضغط 🔊 بجانب أي رسالة لسماع نطقها.</p>${l.dialogue.map(([speaker,en,ar],i)=>`<div class="dialogue-line"><div class="person-avatar">${speaker}</div><div class="bubble"><p lang="en">${esc(en)}</p>${state.showArabic?`<small>${esc(ar)}</small>`:''}<button data-action="speakRaw" data-text="${esc(en)}">🔊 اسمع الجملة</button></div></div>`).join('')}<button class="primary-wide" data-action="playDialogue">▶ استمع للمحادثة كاملة</button></div>`:`<div class="container"><div class="search"><span>⌕</span><input id="searchInput" placeholder="ابحث داخل الجمل بالعربي أو الإنجليزي..." value="${esc(state.search)}" inputmode="search"></div><p style="color:#7a899f;font-size:12px;margin:14px 3px">${filtered.length} جملة • اضغط (حفظ) لمتابعة تقدمك</p><div id="phraseResults">${filtered.map(phraseCard).join('')||'<div class="empty">مفيش نتائج للبحث ده</div>'}</div></div>`}`}
function favoritesPage(){let ps=ALL_PHRASES.filter(p=>state.favorites.includes(p.id));return title('جملك المفضلة','خلّي أهم الجمل قريبة منك وراجعها في أي وقت.')+`<div class="container">${ps.length?`<p style="font-size:12px;color:#7a899f">${ps.length} جملة محفوظة</p>${ps.map(phraseCard).join('')}`:'<div class="empty"><span class="emoji">♡</span>لسه ما أضفتش جمل للمفضلة.<br>افتح أي درس واضغط على القلب جنب الجملة.</div>'}</div>`}
function practicePage(){const completed=state.learned.length;return title('اتدرّب على الإنجليزي','اسمع، جاوب، واتكلم بصوتك — خطوة بخطوة.')+`<div class="container"><div class="training-card"><h2>🧠 اختبر اللي اتعلمته</h2><p>اختبار من 10 أسئلة: شوف الترجمة العربية واختار الجملة الإنجليزية الصحيحة.</p><button data-action="newQuiz">ابدأ الاختبار ←</button></div><div class="training-card" style="background:linear-gradient(145deg,#075a58,#17897a)"><h2>🎙 درّب نطقك</h2><p>اسمع جملة قصيرة، كرّرها بصوتك، وشوف الكلمات اللي نطقتها صح.</p><button data-action="speaking" style="background:#d2fff1">ابدأ تدريب النطق ←</button></div><div class="stats"><div class="stat"><strong>${ALL_PHRASES.length}</strong><span>جملة متاحة</span></div><div class="stat"><strong>${completed}</strong><span>جملة حفظتها</span></div><div class="stat"><strong>${state.quizzes}</strong><span>اختبار مكتمل</span></div></div></div>`}
const shuffled=a=>[...a].sort(()=>Math.random()-.5);
function beginQuiz(onlyLesson=null){let pool=onlyLesson?(LESSONS.find(l=>l.id===onlyLesson)||LESSONS[0]).phrases:ALL_PHRASES;state.quiz={questions:shuffled(pool).slice(0,10).map(p=>({p,options:shuffled([p,...shuffled(ALL_PHRASES.filter(x=>x.id!==p.id)).slice(0,3)])})),idx:0,answer:null,score:0};openPage('quiz')}
function quizPage(){let q=state.quiz;if(!q)return practicePage();if(q.idx>=q.questions.length)return `<div class="container" style="text-align:center;padding-top:65px"><div style="font-size:66px">${q.score>=8?'🏆':'🎉'}</div><h1>خلصت الاختبار!</h1><p style="color:#7c899a">نتيجتك</p><h1 style="font-size:57px;margin:5px">${q.score} / ${q.questions.length}</h1><p>كل محاولة بتقرّبك من مستواك اللي نفسك فيه.</p><button class="primary-wide" data-action="newQuiz">اختبار جديد</button><button class="toolbar-btn" data-action="nav" data-id="practice">الرجوع للتدريب</button></div>`;
 const item=q.questions[q.idx];return `<div class="container"><div class="quiz-meta"><b>السؤال ${q.idx+1} من ${q.questions.length}</b><span>⭐ ${q.score} صح</span></div><div class="bar" style="margin-bottom:23px"><span style="width:${q.idx/q.questions.length*100}%"></span></div><div class="section-title"><h2>اختار الترجمة الصحيحة</h2></div><div class="quiz-stem">${esc(item.p.ar)}</div><div class="quiz-options">${item.options.map(p=>`<button ${q.answer?'disabled':''} class="quiz-option ${q.answer?((p.id===item.p.id)?'correct':q.answer===p.id?'chosen wrong':''):''}" data-action="answer" data-id="${p.id}">${esc(p.en)}</button>`).join('')}</div>${q.answer?`<div style="font-size:13px;font-weight:800;color:${q.answer===item.p.id?'#159069':'#a3533a'}">${q.answer===item.p.id?'✅ إجابة صحيحة!':'❌ الإجابة الصحيحة مظللة بالأخضر'}</div><button class="primary-wide" data-action="nextQuiz">السؤال التالي ←</button><button class="mini-action" data-action="speak" data-id="${item.p.id}">🔊 اسمع الجملة الصحيحة</button>`:'<div class="info-note">اختار إجابة واحدة علشان تعرف نتيجتك فورًا.</div>'}</div>`}
function getSpeakingPhrase(){let list=ALL_PHRASES.filter(p=>p.en.length<=65);return list[state.voiceTarget===null?0:state.voiceTarget%list.length]}
function speakingPage(){const p=getSpeakingPhrase();return title('تدريب النطق 🎙','اضغط على السماعة، اسمع النطق، وبعدين كرّر الجملة بصوتك.')+`<div class="container"><div class="mic-card"><span class="pill">ENGLISH SPEAKING PRACTICE</span><div class="quote-en">${esc(p.en)}</div><p class="quote-ar">${esc(p.ar)}</p><button class="toolbar-btn" data-action="speak" data-id="${p.id}">🔊 اسمع النطق</button><button class="mic-btn" data-action="listen">🎙</button><b>اضغط على الميكروفون واتكلم</b><p id="recognitionStatus">يُفضل مكان هادي وصوت واضح. بعض خدمات التعرف على الكلام تحتاج الإنترنت.</p><div id="recognitionResult" class="speak-result" style="display:none"></div><button class="primary-wide" data-action="nextSpeaking">جملة تانية ←</button></div></div>`}
function settingsPage(){return title('إعدادات التعلّم','ظبّط تجربتك على حسب وقتك وطريقتك في المذاكرة.')+`<div class="container"><div class="setting-row"><div><b>🎯 الهدف اليومي</b><small>عدد الجمل المقترح حفظها كل يوم</small></div><select data-setting="target"><option value="5" ${state.target===5?'selected':''}>5 جمل</option><option value="10" ${state.target===10?'selected':''}>10 جمل</option><option value="15" ${state.target===15?'selected':''}>15 جملة</option></select></div><div class="setting-row"><div><b>🔊 سرعة النطق</b><small>سرعة قراءة الجمل الإنجليزية</small></div><select data-setting="rate"><option value="0.65" ${state.rate===.65?'selected':''}>بطيئة</option><option value="0.85" ${state.rate===.85?'selected':''}>متوسطة</option><option value="1" ${state.rate===1?'selected':''}>طبيعية</option></select></div><div class="setting-row"><div><b>🔁 تكرار النطق</b><small>مرة أو مرتين عند سماع الجملة</small></div><select data-setting="repeat"><option value="1" ${state.repeat===1?'selected':''}>مرة</option><option value="2" ${state.repeat===2?'selected':''}>مرتين</option></select></div><div class="setting-row"><div><b>🇪🇬 الترجمة العربية</b><small>إظهار أو إخفاء الترجمة أسفل الجمل</small></div><select data-setting="showArabic"><option value="true" ${state.showArabic?'selected':''}>إظهار</option><option value="false" ${!state.showArabic?'selected':''}>إخفاء</option></select></div><div class="setting-row"><div><b>🔊 تجربة السماعة</b><small>استمع إلى جملة إنجليزية</small></div><button data-action="testVoice">تشغيل ▶</button></div><div class="info-note">التطبيق بيحفظ الجمل المفضلة والتقدم على نفس الجهاز. ملفات الدروس متاحة بدون إنترنت، والنطق بيستخدم أصوات الإنجليزي المثبتة على هاتفك. التدريب بالميكروفون قد يحتاج لخدمة التعرّف على الكلام والإنترنت.</div><p style="text-align:center;color:#9cacb9;font-size:11px">اتكلم · English for Life & Work · v1.0</p></div>`}
function render(){topNav();const pages={home,lessons:lessonsPage,lesson:lessonPage,favorites:favoritesPage,practice:practicePage,quiz:quizPage,speaking:speakingPage,settings:settingsPage};$('#view').innerHTML=(pages[state.page]||home)()}
function findPhrase(id){return ALL_PHRASES.find(p=>p.id===id)}
let speakingQueueToken=0,pendingDone=null;
function nativeSpeak(text,rate){return new Promise(resolve=>{let resolved=false;const finish=()=>{if(!resolved){resolved=true;pendingDone=null;resolve()}};if(window.AndroidTTS&&typeof window.AndroidTTS.speak==='function'){const token=String(Date.now())+'-'+Math.random().toString(36).slice(2);pendingDone={token,finish};window.AndroidTTS.speak(text,rate,token);setTimeout(finish,12000);return}if(!('speechSynthesis' in window)){toast('جهازك لا يدعم القراءة الصوتية');finish();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.onend=finish;u.onerror=finish;const voices=speechSynthesis.getVoices();const en=voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang.startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u);setTimeout(finish,12000)})}
window.onNativeTtsDone=token=>{if(pendingDone&&pendingDone.token===token)pendingDone.finish()};
function stopAll(){speakingQueueToken++;state.playing=false;if(window.AndroidTTS?.stop)window.AndroidTTS.stop();if('speechSynthesis' in window)speechSynthesis.cancel();if(pendingDone)pendingDone.finish()}
async function playSequence(texts,rate=state.rate){stopAll();const token=speakingQueueToken;state.playing=true;for(let s of texts){for(let r=0;r<state.repeat;r++){if(token!==speakingQueueToken)break;await nativeSpeak(s,rate);if(token!==speakingQueueToken)break;await new Promise(ok=>setTimeout(ok,190))}}if(token===speakingQueueToken)state.playing=false}
function playOne(en,rate=state.rate){playSequence([en],rate)}
function answerQuiz(id){const q=state.quiz;if(!q||q.answer)return;q.answer=id;if(id===q.questions[q.idx].p.id)q.score++;render()}
function nextQuiz(){let q=state.quiz;if(!q)return;q.idx++;q.answer=null;if(q.idx===q.questions.length){state.quizzes++;update()}render()}
function choiceSpeaking(){const list=ALL_PHRASES.filter(p=>p.en.length<=65);state.voiceTarget=Math.floor(Math.random()*list.length);render()}
function normalizeWords(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean)}
function compareSpeech(said){const expected=normalizeWords(getSpeakingPhrase().en),actual=normalizeWords(said);let matched=0;let remaining=[...actual];expected.forEach(w=>{let idx=remaining.indexOf(w);if(idx>=0){matched++;remaining.splice(idx,1)}});const accuracy=Math.round((matched/Math.max(expected.length,actual.length,1))*100);return accuracy}
window.onNativeRecognition=(said)=>{const el=$('#recognitionStatus'),r=$('#recognitionResult');if(!el||!r)return;r.style.display='block';r.textContent=said||'لم أسمع كلامًا واضحًا';if(said){let score=compareSpeech(said);el.textContent=score>=85?'🌟 ممتاز! نطقك قريب جدًا من الجملة':score>=55?'👍 كويس! اسمع الجملة وكرّر مرة أخرى':'💪 حاول مرة تانية؛ اسمع النطق ببطء';r.insertAdjacentHTML('beforeend',`<div style="direction:rtl;text-align:right;font-weight:800;margin-top:8px;color:#148b80">تطابق الكلمات: ${score}% (تقييم تقريبي)</div>`)}else el.textContent='لم يتم التعرف على الكلام. جرّب مرة أخرى.'};
window.onNativeRecognitionError=(s)=>{const el=$('#recognitionStatus');if(el)el.textContent='التعرّف على الصوت غير متاح: '+s};
function listen(){const el=$('#recognitionStatus');if(el)el.textContent='🎙 اسمعك دلوقتي... انطق الجملة بالإنجليزي';if(window.AndroidTTS?.listen){window.AndroidTTS.listen();return}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){if(el)el.textContent='المتصفح لا يدعم التعرف على الصوت. استخدم التطبيق على أندرويد أو Chrome.';return}const r=new SpeechRecognition();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=evt=>window.onNativeRecognition(evt.results[0][0].transcript);r.onerror=evt=>window.onNativeRecognitionError(evt.error);r.onend=()=>{if(el&&el.textContent.includes('اسمعك'))el.textContent='اضغط على الميكروفون للمحاولة مجددًا'};try{r.start()}catch(e){window.onNativeRecognitionError(e.message)}}
function handle(action,id,btn){switch(action){case'nav':openPage(id);break;case'lesson':openPage('lesson',{lesson:id});break;case'lessonMode':state.lessonMode=id;state.search='';stopAll();render();break;case'speak':{const p=findPhrase(id);if(p)playOne(p.en);break}case'speakSlow':{const p=findPhrase(id);if(p)playOne(p.en,.6);break}case'speakRaw':playOne(btn.dataset.text);break;case'favorite':{const idx=state.favorites.indexOf(id);idx>=0?state.favorites.splice(idx,1):state.favorites.push(id);update();render();toast(idx>=0?'تمت الإزالة من المفضلة':'تمت الإضافة للمفضلة ♥');break}case'learn':{const idx=state.learned.indexOf(id);idx>=0?state.learned.splice(idx,1):state.learned.push(id);update();render();toast(idx>=0?'تم إلغاء علامة الحفظ':'برافو عليك! جملة جديدة اتحفظت 🌟');break}case'scrollDaily':$('#dailyLesson')?.scrollIntoView({behavior:'smooth'});break;case'playDaily':playSequence(daysPhrase().map(p=>p.en));toast('بيتم تشغيل جمل اليوم بالترتيب');break;case'playLesson':if(state.playing){stopAll();render()}else{const l=LESSONS.find(x=>x.id===state.lesson);playSequence(l.phrases.map(x=>x.en));btn.textContent='■ إيقاف';toast('بيتم تشغيل الجمل بالترتيب')}break;case'playDialogue':{const l=LESSONS.find(x=>x.id===state.lesson);playSequence(l.dialogue.map(x=>x[1]));toast('استمع للمحادثة');break}case'lessonQuiz':beginQuiz(state.lesson);break;case'lessonSpeaking':choiceSpeaking();openPage('speaking');break;case'newQuiz':beginQuiz();break;case'answer':answerQuiz(id);break;case'nextQuiz':nextQuiz();break;case'speaking':choiceSpeaking();openPage('speaking');break;case'nextSpeaking':choiceSpeaking();break;case'listen':listen();break;case'testVoice':playOne('Hello! Welcome to Etkallem. Let us practice English together.');break;}}
document.addEventListener('click',evt=>{const btn=evt.target.closest('[data-action]');if(btn){evt.preventDefault();handle(btn.dataset.action,btn.dataset.id,btn)}});
document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.tab)));
$('#backBtn').addEventListener('click',()=>openPage(state.page==='lesson'?'lessons':'home'));
$('#quickSpeak').addEventListener('click',()=>playOne('Hello! It is a great day to learn English.'));
document.addEventListener('input',evt=>{if(evt.target.id==='searchInput'){state.search=evt.target.value;const l=LESSONS.find(x=>x.id===state.lesson);const filtered=l.phrases.filter(p=>(p.en+' '+p.ar).toLowerCase().includes(state.search.toLowerCase()));$('#phraseResults').innerHTML=filtered.map(phraseCard).join('')||'<div class="empty">مفيش نتائج للبحث ده</div>'}});
document.addEventListener('change',evt=>{const field=evt.target.dataset.setting;if(!field)return;state[field]=field==='showArabic'?evt.target.value==='true':Number(evt.target.value);update();toast('تم حفظ الإعداد');if(field==='showArabic')render()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();

window.onSystemBack=function(){if(state.page==='home')return false;openPage(state.page==='lesson'?'lessons':'home');return true};

</script>
</body>
</html>
